name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  canisters:
    name: Type-check Motoko canisters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dfx
        run: |
          DFXVM_INIT_YES=true sh -ci "$(curl -fsSL https://internetcomputer.org/install.sh)"
          echo "$HOME/.local/share/dfx/bin" >> "$GITHUB_PATH"

      - name: dfx --version
        run: dfx --version

      # --check type-checks/builds without a running replica. `dfx build` takes a
      # single canister name, so we loop over the five Motoko canisters to skip
      # the `console` assets canister, whose source (console/dist) is not built
      # in this repo yet.
      - name: Build canisters
        run: |
          for canister in identity compute storage database billing; do
            echo "::group::dfx build --check $canister"
            dfx build --check "$canister"
            echo "::endgroup::"
          done

  canister-tests:
    name: Canister integration tests (PocketIC)
    runs-on: ubuntu-latest
    env:
      # Pinned so test results are reproducible; bump together.
      MOC_VERSION: 2.2.2
      MOTOKO_BASE_REF: moc-1.9.0
    defaults:
      run:
        working-directory: protocol-28/tests
    steps:
      - uses: actions/checkout@v4

      - name: Install moc and Motoko base library
        run: |
          mkdir -p "$RUNNER_TEMP/moc"
          curl -fsSL "https://github.com/dfinity/motoko/releases/download/${MOC_VERSION}/motoko-Linux-x86_64-${MOC_VERSION}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/moc"
          git clone --quiet --depth 1 --branch "$MOTOKO_BASE_REF" \
            https://github.com/dfinity/motoko-base.git "$RUNNER_TEMP/motoko-base"
          echo "MOC=$RUNNER_TEMP/moc/moc" >> "$GITHUB_ENV"
          echo "MOTOKO_BASE=$RUNNER_TEMP/motoko-base/src" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: protocol-28/tests/package-lock.json

      # npm 10 runs @dfinity/pic's postinstall, which downloads the PocketIC
      # server pinned in .pocket-ic-version.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  cli:
    name: Build Lemniskit CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lemniskit/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lemniskit/cli/package-lock.json

      - run: npm ci

      - run: npm run build
