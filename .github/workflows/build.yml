name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  canisters-dfx:
    name: Type-check Motoko canisters (dfx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dfx
        run: |
          DFXVM_INIT_YES=true sh -ci "$(curl -fsSL https://internetcomputer.org/install.sh)"
          echo "$HOME/.local/share/dfx/bin" >> "$GITHUB_PATH"

      - name: dfx --version
        run: dfx --version

      - name: Build Motoko canisters
        run: |
          for canister in identity compute storage database billing; do
            echo "::group::dfx build --check $canister"
            dfx build --check "$canister"
            echo "::endgroup::"
          done

  workspace:
    name: Build & Test Workspace (Canisters Wasm, SDK, CLI, Console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SDK, CLI, and Console (console/dist)
        run: npm run build

      - name: Run all test suites
        run: npm test
